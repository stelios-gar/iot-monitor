spring.application.name=backend

# Database. These defaults match docker-compose.yml, so a fresh clone
# connects with zero configuration; override any of them via real
# environment variables for anywhere other than local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/iot_monitor}
spring.datasource.username=${DB_USERNAME:iotuser}
spring.datasource.password=${DB_PASSWORD:iotpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}

# CORS: the origin allowed to call the REST API and open the WebSocket
# (the Angular dev server by default). Override for a deployed frontend.
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
