# Test-only overrides (test/resources wins over main/resources on the test
# classpath). Runs every test — including the full-context
# BackendApplicationTests — against an in-memory H2 database in
# PostgreSQL-compatibility mode, so `./mvnw test` never needs a real
# Postgres instance running.
spring.datasource.url=jdbc:h2:mem:iot_monitor_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# This file replaces (not merges with) main/resources/application.properties
# on the test classpath, so anything the app needs that isn't Postgres-
# related has to be repeated here too.
cors.allowed-origin=http://localhost:4200
